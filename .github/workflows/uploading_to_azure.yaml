

name: auto-publish
on:
  push:
    branches:
      - main

jobs:
  
  auto-publish:
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      
      - name: Use project node version
        uses: actions/setup-node@v4
        with:
          node-version: '23.5.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install


      - name: Major update
        if: github.ref_type == 'tag'
        run: python -m autoVersioning.py minor

      - name: Minor update
        if: github.ref_type == 'branch'
        run: python -m autoVersioning.py major

      - name: Run tests
        run: npm run deploy
        
