

name: auto-publish
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Glob pattern to match tags like v1.0.0

jobs:
  
  auto-publish:
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      
      - name: Use project node version
        uses: actions/setup-node@v4
        with:
          node-version: '23.5.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install


      - name: Major update
        run:
          VERSION=${GITHUB_REF_NAME#v}
          echo "Version is $VERSION"
          python -m autoVersioning $VERSION

    

      - name: Run tests
        run: npm run deploy
        
